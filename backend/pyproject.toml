[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "fireops-sim-backend"
version = "0.1.0"
description = "Synthetic wildfire response research environment under degraded information"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "gymnasium>=1.0,<2.0",
  "numpy>=1.26,<3.0",
  "pydantic>=2.9,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
ppo = ["stable-baselines3>=2.4,<3.0", "torch>=2.2"]
test = ["httpx2>=2.9,<3.0", "pytest>=8.0,<9.0", "pytest-cov>=5.0,<8.0"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
branch = true
